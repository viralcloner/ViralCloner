<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralCloner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent-color: #8b5cf6;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 8s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.5s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 2.5s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 3.5s; }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        /* Main splash container */
        .splash-container {
            text-align: center;
            z-index: 10;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo animation */
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 20px 40px -10px rgba(99, 102, 241, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            fill: white;
        }

        /* App name */
        .app-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .app-tagline {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        /* Loading spinner */
        .loader-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 24px;
        }

        .loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .loader-outer {
            border: 3px solid transparent;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
        }

        .loader-middle {
            top: 8px;
            left: 8px;
            width: calc(100% - 16px);
            height: calc(100% - 16px);
            border: 3px solid transparent;
            border-right-color: var(--accent-color);
            animation: spin 0.8s linear infinite reverse;
        }

        .loader-inner {
            top: 16px;
            left: 16px;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
            border: 3px solid transparent;
            border-bottom-color: var(--primary-light);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Loading text */
        .loading-status {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        /* Progress bar */
        .progress-wrapper {
            width: 240px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: progressShine 1.5s ease-in-out infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Version */
        .version {
            position: fixed;
            bottom: 20px;
            right: 24px;
            font-size: 12px;
            color: rgba(100, 116, 139, 0.6);
        }

        /* Decorative gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.2);
            top: -200px;
            right: -100px;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.15);
            bottom: -150px;
            left: -100px;
            animation: orbFloat 10s ease-in-out infinite reverse;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        /* Fade out animation class */
        .fade-out {
            animation: fadeOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
    <!-- Background decorative elements -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Floating particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main splash content -->
    <div class="splash-container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </div>
        </div>

        <h1 class="app-name">ViralCloner</h1>
        <p class="app-tagline">Automate Your Content Strategy</p>

        <div class="loader-wrapper">
            <div class="loader loader-outer"></div>
            <div class="loader loader-middle"></div>
            <div class="loader loader-inner"></div>
        </div>

        <p class="loading-status" id="loadingStatus">Initializing...</p>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <span class="version" id="appVersion">v1.0.0</span>

    <script>
        // Loading status messages
        const loadingSteps = [
            { text: 'Initializing application...', progress: 10 },
            { text: 'Loading configuration...', progress: 25 },
            { text: 'Setting up database...', progress: 40 },
            { text: 'Preparing workspace...', progress: 55 },
            { text: 'Loading modules...', progress: 70 },
            { text: 'Verifying license...', progress: 85 },
            { text: 'Almost ready...', progress: 95 }
        ];

        const statusEl = document.getElementById('loadingStatus');
        const progressBar = document.getElementById('progressBar');
        let currentStep = 0;

        // Simulate loading progress
        function updateProgress() {
            if (currentStep < loadingSteps.length) {
                const step = loadingSteps[currentStep];
                statusEl.textContent = step.text;
                progressBar.style.width = step.progress + '%';
                currentStep++;
            }
        }

        // Start progress animation
        updateProgress();
        const progressInterval = setInterval(updateProgress, 600);

        // Listen for ready signal from main process
        if (window.electronAPI) {
            window.electronAPI.onSplashReady(() => {
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                statusEl.textContent = 'Ready!';
                
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                }, 200);
            });

            // Get app version
            window.electronAPI.getAppVersion().then(version => {
                document.getElementById('appVersion').textContent = 'v' + version;
            }).catch(() => {});
        }

        // Fallback: complete after max time
        setTimeout(() => {
            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            statusEl.textContent = 'Ready!';
        }, 5000);
    </script>
</body>
</html>
